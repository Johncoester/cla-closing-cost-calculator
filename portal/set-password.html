<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set password — C.L.A. Quote Portal</title>
<meta name="theme-color" content="#000000"><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<script src="config.js"></script>
<script src="js/mock-data.js"></script><script src="js/mock-adapter.js"></script><script src="js/supabase-adapter.js"></script><script src="js/auth-adapter.js"></script><script src="js/portal-ui.js"></script>
</head><body>
<main class="pg narrow">
<div class="card">
 <h1 class="pt" id="title">Choose a new password</h1>
 <p class="sub" id="sub">Pick a password you do not use anywhere else.</p>
 <div id="err" class="msg err" role="alert"></div>
 <form id="f" novalidate>
  <div class="fgrp"><label for="pw">New password</label><input type="password" id="pw" autocomplete="new-password" required>
   <ul class="pwrules" id="rules"></ul></div>
  <div class="fgrp"><label for="pw2">Confirm password</label><input type="password" id="pw2" autocomplete="new-password" required></div>
  <label class="chk" id="termsRow" hidden><input type="checkbox" id="terms"><span>I accept the <a href="#" id="tlink">privacy notice and terms</a> <span class="sum">(placeholder text until counsel approves)</span>.</span></label>
  <button class="btn" id="go" type="submit" style="width:100%">Save password</button>
 </form>
 <div class="linkrow"><a href="login.html">Back to sign in</a></div>
</div>
</main>
<script>
(async () => {
  const { $ } = CLA; const { A } = await CLA.boot(false);
  const invite = CLA.q("invite") === "1" || /type=invite/.test(location.hash);
  if (invite) { $("title").textContent = "Welcome to CLA"; $("sub").textContent = "You were invited by CLA. Create a password, then finish your profile and photo."; $("termsRow").hidden = false; $("go").textContent = "Create my account"; }
  $("tlink").onclick = (e) => { e.preventDefault(); alert("Privacy notice and terms will be linked here once counsel has approved the text."); };
  if (!(await A.hasRecoverySession())) { $("err").textContent = "This link has expired or was already used. Request a new one from the sign-in page."; $("f").hidden = true; return; }
  const draw = () => { const bad = CLA.passwordProblems($("pw").value), all = ["At least 12 characters", "Upper and lower case letters", "A number"];
    $("rules").innerHTML = all.map((r) => '<li class="' + (bad.includes(r) ? "" : "ok") + '">' + (bad.includes(r) ? "○ " : "✓ ") + r + "</li>").join(""); return bad; };
  draw(); $("pw").oninput = draw;
  $("f").onsubmit = async (e) => {
    e.preventDefault(); $("err").textContent = "";
    if (draw().length) { $("err").textContent = "That password does not meet the rules below."; return; }
    if ($("pw").value !== $("pw2").value) { $("err").textContent = "The two passwords do not match."; return; }
    if (invite && !$("terms").checked) { $("err").textContent = "Please accept the privacy notice and terms to continue."; return; }
    $("go").disabled = true;
    try { await A.updatePassword($("pw").value); if (invite) await A.acceptTerms(); }
    catch (ex) { $("err").textContent = ex.message; $("go").disabled = false; return; }
    $("pw").value = $("pw2").value = "";
    location.href = invite ? "profile.html?welcome=1" : (await A.getSession()) ? "profile.html" : "login.html";
  };
})();
</script></body></html>
